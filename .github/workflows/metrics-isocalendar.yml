name: Generate 3D isocalendar

on:
  schedule:
    # every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate isocalendar metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          committer_branch: metrics
          committer_message: "chore: update isocalendar"
          filename: metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Ho_Chi_Minh
          config_display: large
          extras_css: |
            [fill="#ebedf0"] { fill: #161b22 }
            [fill="#9be9a8"] { fill: #0e4429 }
            [fill="#40c463"] { fill: #006d32 }
            [fill="#30a14e"] { fill: #26a641 }
            [fill="#216e39"] { fill: #39d353 }
